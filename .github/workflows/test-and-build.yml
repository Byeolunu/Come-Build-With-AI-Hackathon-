name: Test and Build
on:
  pull_request:
    types:
      - opened
  push:

jobs:
  tests:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen
          uv pip install coveralls

      - name: Run linting
        run: |
          uv run ruff check src tests

      - name: Run tests with coverage
        run: |
          uv run pytest -v tests --cov=src --cov-report=term --cov-report=xml

      - name: Send coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.xml
          flag-name: python-3.13
          parallel: true

  post-tests:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
